; Fretboard Master – budżety wydajności dla każdego ekranu (wartości maksymalne w klatce).
; Sprawdzane przez:  godot --path app --rendering-driver opengl3 -- --perf-audit
; Przekroczenie dowolnej wartości = kod wyjścia 1 (do CI). Pomiar bazowy: 2026-11-26, Godot 4.7.1,
; 1920×1080, motyw „Nocny”. Budżet = pomiar + ok. 25% zapasu, zaokrąglony.
; Czcionki rastrowe (bez MSDF) – każdy rozmiar ma własną teksturę glifów; wyniki EN, PL i RU
; są praktycznie równe, ale audyt warto sprawdzać po rosyjsku (najwięcej glifów).
;   draw_calls       – wywołania rysowania głównego okna
;   objects          – elementy rysowane w klatce (canvas items i obiekty 3D)
;   primitives       – prymitywy (trójkąty) w klatce
;   processing_nodes – węzły z włączonym _process/_physics_process (ekrany statyczne: 0)
;   video_mem_mb     – pamięć wideo

